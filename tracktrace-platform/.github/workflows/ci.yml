name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tnt
          POSTGRES_PASSWORD: tnt_dev_pw
          POSTGRES_DB: tnt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tnt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app
      - name: Run tests against real PostgreSQL
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://tnt:tnt_dev_pw@localhost:5432/tnt_test
          TEST_DATABASE_URL: postgresql+psycopg://tnt:tnt_dev_pw@localhost:5432/tnt_test
        run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npm run build
